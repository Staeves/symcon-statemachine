<svg>
	<defs>
		<marker id="arrow" markerWidth="13" markerHeight="13" refx="2" refy="6" orient="auto">
			<path d="M2,2 L2,11 L10,6 L2,2" style="fill:black;" />
		</marker>
	</defs>
	<g id="image">
	</g>
</svg>
<script>
	/*
	 * states = {<genID>: {name:<name>, id: <id>, values: {<ipsID>:<value>,...}},...}
	 * stateGroups = {<genID>: {name:<name>, states: [<stateGenID>,...]},...}
	 * transitions = [{transitionStart:<genID>, transitionEnd:<genID>, transitionTrigger:<genID>},...]
	 * activeState = <genID>
	 */
	function drawStatemachine() {
		let svg = document.getElementById("image");
		console.log(states);
		// reset everyone
		for (const genID in states) {
			console.log(genID);
			states[genID].outgoingCount = 0;
		}
		for (const genID in stateGroups) {
			console.log(genID);
			states[genID].outgoingCount = 0;
		}
		// count how many outgoing
		for (const trans of transitions) {
			if (trans["transitionStart"] in states) {
				states[trans["transitionStart"]].outgoingCount += 1;
			} else {
				stateGroups[trans["transitionStart"]].outgoingCount += 1;
			}
		}
		// get a list of all states with outgoing transitions to draw on the left
		let leftStates = [];
		for (const genID in states) {
			if (states[genID].outgoingCount > 0) {
				leftStates.push(genID);
			}
		}
		//leftStates.push(...Object.keys(stateGroups));
		// clear out the current image
		svg.innerHTML = "";
		// place all left states
		let y = 20;
		for (const genID of leftStates) {
			let text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
			text.setAttribute("id", genID);
			text.setAttribute('x', '20');
			text.setAttribute('y', y);
			svg.appendChild(text);
			y += 30;
		}
	}

	drawStatemachine();
</script>
