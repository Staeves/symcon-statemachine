<svg width="100%" height="100%" id="svg">
	<defs>
		<marker id="arrow" markerWidth="13" markerHeight="13" refx="2" refy="6" orient="auto">
			<path d="M2,2 L2,11 L10,6 L2,2" style="fill:black;" />
		</marker>
		<filter x="-0.1" y="-0.1" width="1.2" height="1.2" id="background">
			<feFlood flood-color="grey" result="bg" />
			<feMerge>
				<feMergeNode in="bg"/>
				<feMergeNode in="SourceGraphic"/>
			</feMerge>
		</filter>
		<filter x="-0.1" y="-0.1" width="1.2" height="1.2" id="active-background">
			<feFlood flood-color="green" result="bg" />
			<feMerge>
				<feMergeNode in="bg"/>
				<feMergeNode in="SourceGraphic"/>
			</feMerge>
		</filter>
	</defs>
	<g id="image">
	</g>
</svg>
<script>
	/*
	 * states = {<genID>: {name:<name>, id: <id>, values: {<ipsID>:<value>,...}},...}
	 * stateGroups = {<genID>: {name:<name>, states: [<stateGenID>,...]},...}
	 * transitions = [{transitionStart:<genID>, transitionEnd:<genID>, transitionTrigger:<genID>},...]
	 * activeState = <genID>
	 */
	function drawStatemachine() {
		let svg = document.getElementById("image");
		console.log(states);
		// reset everyone
		for (const genID in states) {
			console.log(genID);
			states[genID].outgoingCount = 0;
		}
		for (const genID in stateGroups) {
			console.log(genID);
			stateGroups[genID].outgoingCount = 0;
		}
		// count how many outgoing
		for (const trans of transitions) {
			console.log(trans);
			if (trans["transitionStart"] in states) {
				states[trans["transitionStart"]].outgoingCount += 1;
			} else {
				stateGroups[trans["transitionStart"]].outgoingCount += 1;
			}
		}
		// get a list of all states with outgoing transitions to draw on the left
		let leftStates = [];
		for (const genID in states) {
			if (states[genID].outgoingCount > 0) {
				leftStates.push(genID);
			}
		}
		//leftStates.push(...Object.keys(stateGroups));
		// clear out the current image
		svg.innerHTML = "";
		// place all left states
		let y = 20;
		for (const genID of leftStates) {
			placeState("left-", genID, 20, y, "start", states[genID].name, svg);
			y += 30;
		}
		for (const genID in stateGroups) {
			placeState("left-", genID, 20, y, "start", stateGroups[genID].name, svg);
			y += 30;
		}
		// place right states
		y = 20
		for (const genID in states) {
			placeState("right-", genID, document.getElementById("svg").getBoundingClientRect().width - 20, y, "end", states[genID].name, svg);
			y += 30;
		}
		// draw transitions
		for (const trans of transitions) {
			let start = document.getElementById("left-" + trans["transitionStart"]).getBBox();
			let end = document.getElementById("right-" + trans["transitionEnd"]).getBBox();
			console.log(start);
			console.log(end);
			let d = "M" + (start.x + (start.width*1.2)) + "," + (start.y + (start.height/2)) + " L" + end.x + "," + (end.y + (end.height/2));
			let style = "stroke:red; stroke-width: 1.25px; fill: none; marker-end: url(#arrow);";
			let arrow = document.createElementNS('http://www.w3.org/2000/svg', 'path');
			arrow.setAttribute("d", d);
			arrow.setAttribute("style", style);
			svg.appendChild(arrow);
		}
	}

	function placeState(prefix, genID, x, y, anchor, name, svg) {
		let text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
		text.setAttribute("id", prefix + genID);
		if (genID == activeState) {
			text.setAttribute("filter", "url(#active-background)");
		} else {
			text.setAttribute("filter", "url(#background)");
		}
		text.setAttribute('x', x);
		text.setAttribute('y', y);
		text.setAttribute('text-anchor', anchor);
		text.textContent = name;
		svg.appendChild(text);
	}

	drawStatemachine();
</script>
